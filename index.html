    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background:
                radial-gradient(circle at 50% 35%, #312e81 0%, #1e1b4b 35%, #0f172a 100%);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* =========================
           GLASS
        ========================= */

        .glass-box {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* =========================
           CARD GLOW
        ========================= */

        #game-card {
            transition:
                transform 0.45s ease,
                box-shadow 0.45s ease,
                border-color 0.45s ease;
        }

        #game-card:hover {
            box-shadow:
                0 0 25px rgba(244, 114, 182, 0.12),
                0 20px 60px rgba(0, 0, 0, 0.35);
        }

        /* =========================
           TRANSITIONS
        ========================= */

        .fade-transition {
            transition:
                opacity 0.45s ease,
                transform 0.45s cubic-bezier(.22,.61,.36,1),
                filter 0.45s ease;
        }

        .hidden-step {
            opacity: 0;
            transform: translateY(18px) scale(0.98);
            filter: blur(4px);
            pointer-events: none;
        }

        .visible-step {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        /* =========================
           HEARTS
        ========================= */

        .bg-heart {
            position: absolute;
            color: rgba(244, 114, 182, 0.18);
            animation: floatUp linear infinite;
            z-index: 0;
            user-select: none;
            will-change: transform, opacity;
            filter: blur(0.2px);
        }

        @keyframes floatUp {
            0% {
                transform:
                    translateY(110vh)
                    translateX(0)
                    scale(0.5)
                    rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 0.5;
            }

            50% {
                transform:
                    translateY(45vh)
                    translateX(18px)
                    scale(0.9)
                    rotate(8deg);
                opacity: 0.65;
            }

            85% {
                opacity: 0.35;
            }

            100% {
                transform:
                    translateY(-15vh)
                    translateX(-20px)
                    scale(1.25)
                    rotate(-8deg);
                opacity: 0;
            }
        }

        /* =========================
           SPARKLES
        ========================= */

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
            animation: sparkleFloat 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes sparkleFloat {
            0%,100% {
                opacity: 0;
                transform: scale(0);
            }

            50% {
                opacity: 0.8;
                transform: scale(1);
            }
        }

        /* =========================
           INPUT
        ========================= */

        .answer-input {
            width: 100%;
            min-height: 115px;
            resize: none;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(244,114,182,0.35);

            border-radius: 18px;

            padding: 15px;

            color: white;

            outline: none;

            font-family: 'Cairo', sans-serif;

            font-size: 14px;

            line-height: 1.8;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease,
                transform 0.25s ease;
        }

        .answer-input::placeholder {
            color: rgba(255,255,255,0.45);
        }

        .answer-input:focus {
            border-color: rgba(244,114,182,0.9);

            background: rgba(244,114,182,0.08);

            box-shadow:
                0 0 25px rgba(244,114,182,0.22);

            transform: translateY(-1px);
        }

        /* =========================
           SUBMIT BUTTON
        ========================= */

        .submit-answer-btn {
            position: relative;

            overflow: hidden;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                opacity 0.25s ease;
        }

        .submit-answer-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 25px rgba(244,114,182,0.35);
        }

        .submit-answer-btn:active {
            transform: scale(0.96);
        }

        .submit-answer-btn::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.2),
                    transparent
                );

            transform: skewX(-20deg);

            transition: left 0.6s ease;
        }

        .submit-answer-btn:hover::before {
            left: 150%;
        }

        /* =========================
           ANSWER REVIEW
        ========================= */

        .answer-review {
            animation:
                answerReview 0.6s cubic-bezier(.17,.67,.35,1.2);
        }

        @keyframes answerReview {

            0% {
                opacity: 0;
                transform:
                    scale(0.88)
                    translateY(18px);
                filter: blur(5px);
            }

            70% {
                transform:
                    scale(1.02)
                    translateY(-2px);
            }

            100% {
                opacity: 1;
                transform:
                    scale(1)
                    translateY(0);
                filter: blur(0);
            }
        }

        .user-answer-box {
            background:
                rgba(99,102,241,0.13);

            border:
                1px solid rgba(129,140,248,0.35);

            box-shadow:
                0 0 20px rgba(99,102,241,0.08);
        }

        .ahmed-answer-box {
            background:
                rgba(244,114,182,0.13);

            border:
                1px solid rgba(244,114,182,0.4);

            box-shadow:
                0 0 20px rgba(244,114,182,0.12);
        }

        /* =========================
           OPTIONS
        ========================= */

        .option-btn {
            position: relative;
            overflow: hidden;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease;
        }

        .option-btn:hover {
            box-shadow:
                0 0 22px rgba(244, 114, 182, 0.35);

            border-color:
                rgba(244, 114, 182, 0.75);

            transform:
                translateY(-2px)
                scale(1.015);

            background:
                rgba(244, 114, 182, 0.09);
        }

        .option-btn:active {
            transform: scale(0.96);

            box-shadow:
                0 0 30px rgba(244, 114, 182, 0.55);
        }

        /* =========================
           QUESTION ICON
        ========================= */

        .question-icon {
            animation:
                softPulse 2.2s ease-in-out infinite,
                floatIcon 3s ease-in-out infinite;
        }

        @keyframes softPulse {

            0%,100% {
                filter:
                    drop-shadow(
                        0 0 0
                        rgba(244,114,182,0)
                    );
            }

            50% {
                filter:
                    drop-shadow(
                        0 0 14px
                        rgba(244,114,182,0.6)
                    );
            }
        }

        @keyframes floatIcon {

            0%,100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-5px);
            }
        }

        /* =========================
           REPLY APPEAR
        ========================= */

        .reply-pop {
            animation:
                replyPop
                0.55s
                cubic-bezier(.17,.67,.35,1.35);
        }

        @keyframes replyPop {

            0% {
                opacity: 0;
                transform:
                    scale(0.85)
                    translateY(12px);
            }

            70% {
                transform:
                    scale(1.03)
                    translateY(-2px);
            }

            100% {
                opacity: 1;
                transform:
                    scale(1)
                    translateY(0);
            }
        }

        /* =========================
           FINAL SCREEN
        ========================= */

        .final-screen {
            animation:
                finalEnter
                0.9s
                cubic-bezier(.17,.67,.35,1.2);
        }

        @keyframes finalEnter {

            0% {
                opacity: 0;

                transform:
                    scale(0.75)
                    translateY(30px);

                filter: blur(8px);
            }

            100% {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

                filter: blur(0);
            }
        }

        .final-crown {
            animation:
                crownFloat 2.2s ease-in-out infinite,
                crownGlow 2s ease-in-out infinite;
        }

        @keyframes crownFloat {

            0%,100% {
                transform:
                    translateY(0)
                    rotate(-2deg);
            }

            50% {
                transform:
                    translateY(-9px)
                    rotate(2deg);
            }
        }

        @keyframes crownGlow {

            0%,100% {
                filter:
                    drop-shadow(
                        0 0 4px
                        rgba(244,114,182,0.3)
                    );
            }

            50% {
                filter:
                    drop-shadow(
                        0 0 22px
                        rgba(244,114,182,0.85)
                    );
            }
        }

        .final-message {

        }

        /* =========================
           PROGRESS
        ========================= */

        #progress-bar {
            box-shadow:
                0 0 12px rgba(244,114,182,0.65);

        /* =========================
           MOBILE
        ========================= */

            }

            }

        }

        /* =========================
           ACCESSIBILITY
        ========================= */

            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }
        }

    </style>
</head>

        /* =====================================================
           AUDIO ENGINE
        ===================================================== */

        let audioCtx = null;


        function getAudioContext() {

            if (!audioCtx) {

                audioCtx =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

            }

            if (
                audioCtx.state === "suspended"
            ) {

                audioCtx.resume();

            }

            return audioCtx;
        }


        function playTone(
            frequency = 600,
            duration = 0.08,
            volume = 0.07,
            type = "sine"
        ) {

            try {

                const ctx =
                    getAudioContext();

                const osc =
                    ctx.createOscillator();

                const gain =
                    ctx.createGain();


                osc.type = type;


                osc.frequency.setValueAtTime(
                    frequency,
                    ctx.currentTime
                );


                gain.gain.setValueAtTime(
                    volume,
                    ctx.currentTime
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.001,
                    ctx.currentTime + duration
                );


                osc.connect(gain);

                gain.connect(
                    ctx.destination
                );


                osc.start();


                osc.stop(
                    ctx.currentTime + duration
                );

            } catch (e) {}

        }

            },


            {
                q: "جاهزة تختمي التحدي وتعرفي الرسالة الأخيرة من أحمد؟",

                ahmedReply:
                    "هي تو بدجيك اخر رساله مني 🙂🙈"
            }

        ];


        /* =====================================================
           VARIABLES
        ===================================================== */

        let currentIndex = 0;

        let userAnswersLog = [];


        let currentUserAnswer =
            "";


        const qText =
            document.getElementById(
                "q-text"
            );


        const answerInput =
            document.getElementById(
                "answer-input"
            );


        const submitAnswerBtn =
            document.getElementById(
                "submit-answer-btn"
            );


        const progressText =
            document.getElementById(
                "progress-text"
            );


        const progressBar =
            document.getElementById(
                "progress-bar"
            );


        const questionContainer =
            document.getElementById(
                "question-container"
            );


        const ahmedReplyArea =
            document.getElementById(
                "ahmed-reply-area"
            );


        const userAnswerText =
            document.getElementById(
                "user-answer-text"
            );


        const ahmedReplyText =
            document.getElementById(
                "ahmed-reply-text"
            );


        const reviewContent =
            document.getElementById(
                "review-content"
            );


        /* =====================================================
           LOAD QUESTION
        ===================================================== */

        function loadQuestion() {

            if (
                currentIndex >=
                quizData.length
            ) {

                showFinalCelebration();

                return;
            }


            const current =
                quizData[currentIndex];


            const progressPercent =
                (
                    (currentIndex + 1) /
                    quizData.length
                ) * 100;


            progressBar.style.width =
                progressPercent + "%";


            progressText.innerText =
                `السؤال ${currentIndex + 1} من ${quizData.length}`;


            questionContainer.classList.remove(
                "visible-step"
            );


            questionContainer.classList.add(
                "hidden-step"
            );


            ahmedReplyArea.classList.remove(
                "visible-step"
            );


            ahmedReplyArea.classList.add(
                "hidden-step"
            );


            setTimeout(() => {

                qText.innerText =
                    current.q;


                answerInput.value =
                    "";


                answerInput.disabled =
                    false;


                submitAnswerBtn.disabled =
                    false;


                submitAnswerBtn.style.opacity =
                    "1";


                currentUserAnswer =
                    "";


                questionContainer.classList.remove(
                    "hidden-step"
                );


                questionContainer.classList.add(
                    "visible-step"
                );


                setTimeout(() => {

                    answerInput.focus();

                }, 150);

            }, 280);

        }


        /* =====================================================
           SUBMIT ANSWER
        ===================================================== */

        function submitAnswer() {

            const answer =
                answerInput.value.trim();


            /* لا تسمح بإرسال إجابة فارغة */

            if (!answer) {

                answerInput.focus();

                answerInput.style.borderColor =
                    "rgba(248,113,113,0.9)";

                answerInput.style.boxShadow =
                    "0 0 22px rgba(248,113,113,0.2)";


                setTimeout(() => {

                    answerInput.style.borderColor =
                        "";

                    answerInput.style.boxShadow =
                        "";

                }, 900);


                return;
            }


            playClickSound();


            confetti({
                particleCount: 35,

                spread: 65,

                startVelocity: 20,

                origin: {
                    y: 0.7
                }
            });


            currentUserAnswer =
                answer;


            const current =
                quizData[currentIndex];


            /*
             * حفظ السؤال + إجابة المستخدم
             * + جواب أحمد
             */

            userAnswersLog.push(

                `السؤال ${currentIndex + 1}:\n` +

                `${current.q}\n\n` +

                `إجابتها:\n` +

                `${answer}\n\n` +

                `جواب أحمد:\n` +

                `${current.ahmedReply}\n` +

                `-----------------------------\n`

            );


            /*
             * تعطيل الإدخال
             */

            answerInput.disabled =
                true;


            submitAnswerBtn.disabled =
                true;


            submitAnswerBtn.style.opacity =
                "0.5";


            /*
             * إخفاء السؤال
             */

            questionContainer.classList.remove(
                "visible-step"
            );


            questionContainer.classList.add(
                "hidden-step"
            );


            /*
             * إظهار الإجابات
             */

            setTimeout(() => {

                userAnswerText.innerText =
                    answer;


                ahmedReplyText.innerText =
                    current.ahmedReply;


                /*
                 * إعادة تشغيل حركة الظهور
                 */

                reviewContent.classList.remove(
                    "answer-review"
                );


                void reviewContent.offsetWidth;


                reviewContent.classList.add(
                    "answer-review"
                );


                ahmedReplyArea.classList.remove(
                    "hidden-step"
                );


                ahmedReplyArea.classList.add(
                    "visible-step"
                );


            }, 280);

        }


        /* =====================================================
           ENTER KEY
        ===================================================== */

        answerInput.addEventListener(
            "keydown",
            function(event) {

                /*
                 * Enter = إرسال
                 *
                 * Shift + Enter =
                 * سطر جديد
                 */

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    submitAnswer();

                }

            }
        );


        /* =====================================================
           NEXT QUESTION
        ===================================================== */

        function nextQuestion() {

            playNextSound();


            currentIndex++;


            if (
                currentIndex >=
                quizData.length
            ) {

                showFinalCelebration();

                return;
            }


            loadQuestion();

        }


        /* =====================================================
           FINAL CELEBRATION
        ===================================================== */

        function showFinalCelebration() {

            playFinalSound();


            /*
             * انفجار أول
             */

            confetti({

                particleCount: 120,

                spread: 100,

                startVelocity: 35,

                origin: {
                    y: 0.55
                }

            });


            /*
             * انفجار ثاني
             */

            setTimeout(() => {

                confetti({

                    particleCount: 120,

                    spread: 120,

                    startVelocity: 30,

                    origin: {
                        x: 0.15,
                        y: 0.6
                    }

                });


                confetti({

                    particleCount: 120,

                    spread: 120,

                    startVelocity: 30,

                    origin: {
                        x: 0.85,
                        y: 0.6
                    }

                });

            }, 450);


            const fullLog =
                userAnswersLog.join("\n");


            const card =
                document.getElementById(
                    "game-card"
                );


            card.innerHTML = `

                <div
                    class="final-screen py-2"
                >

                    <span
                        class="final-crown text-5xl mb-3 block"
                    >
                        👑💖
                    </span>


                    <h2
                        class="text-xl md:text-2xl font-extrabold text-pink-400 mb-3"
                    >
                        رسالة الغول الأسطورية لك يا غالية!
                    </h2>


                    <p
                        id="typed-message"
                        class="final-message text-gray-200 text-xs md:text-sm leading-relaxed mb-5 bg-pink-950/40 p-5 rounded-2xl border border-pink-500/30 min-h-[110px] text-right"
                    ></p>


                    <button
                        onclick="copyAnswers()"
                        class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-3 rounded-xl font-bold shadow-lg hover:opacity-95 transition mb-3 text-sm option-btn"
                    >
                        📋 نسخ كل الأسئلة وإجاباتها ❤️
                    </button>


                    <button
                        onclick="location.reload()"
                        class="text-xs text-gray-400 underline hover:text-white transition"
                    >
                        العب من جديد 🔄
                    </button>

                </div>

            `;


            const messageText =

                "يا أجمل وأروع صدفة دخلت دنيتي.. انتي مو بس حبيبتي، انتي عالمي الخاص، روحي، وكل شي فيا 🙈💋❣️. نحبك اليوم، وبكرة، ولآخر العمر يا أسطورة الكون كله. امووووووووووووووووووووووووووحححح 💋💋💋💋";


            const typedElement =
                document.getElementById(
                    "typed-message"
                );


            let charIndex = 0;


            function typeWriter() {

                if (
                    charIndex <
                    messageText.length
                ) {

                    typedElement.innerHTML +=
                        messageText.charAt(
                            charIndex
                        );


                    charIndex++;


                    setTimeout(
                        typeWriter,
                        28
                    );

                }

            }


            /*
             * بداية الرسالة بعد لحظة
             */

            setTimeout(
                typeWriter,
                500
            );


            window.finalLogToCopy =
                fullLog;

        }


        /* =====================================================
           COPY ANSWERS
        ===================================================== */

        async function copyAnswers() {

            playClickSound();


            if (
                !window.finalLogToCopy
            ) {

                return;

            }


            const copyText =
                window.finalLogToCopy;


            try {

                /*
                 * الطريقة الحديثة
                 */

                if (
                    navigator.clipboard &&
                    window.isSecureContext
                ) {

                    await navigator.clipboard.writeText(
                        copyText
                    );

                }

                else {

                    /*
                     * طريقة احتياطية
                     */

                    const textArea =
                        document.createElement(
                            "textarea"
                        );


                    textArea.value =
                        copyText;


                    textArea.style.position =
                        "fixed";

                    textArea.style.opacity =
                        "0";


                    document.body.appendChild(
                        textArea
                    );


                    textArea.focus();

                    textArea.select();


                    document.execCommand(
                        "copy"
                    );


                    textArea.remove();

                }


                alert(
                    "تم نسخ كل الأسئلة وإجاباتك وجواب أحمد بنجاح ❤️"
                );


            }

            catch (error) {

                alert(
                    "عذراً، لم يتم النسخ. يمكنك تحديد النص ونسخه يدويًا."
                );

            }

        }


        /* =====================================================
           START
        ===================================================== */

        loadQuestion();

    </script>

</body>
</html>
