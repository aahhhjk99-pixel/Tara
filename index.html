<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>تحدي القلوب مع أحمد ✨</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Cairo", sans-serif;
      color: white;
      overflow-x: hidden;

      background:
        radial-gradient(circle at 20% 20%, rgba(255, 105, 180, 0.18), transparent 30%),
        radial-gradient(circle at 80% 10%, rgba(180, 90, 255, 0.18), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(255, 50, 120, 0.15), transparent 35%),
        linear-gradient(135deg, #090313, #17051f 45%, #090313);
    }

    .page {
      min-height: 100vh;
      padding: 25px 15px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .background-glow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
      pointer-events: none;
      animation: glowMove 8s ease-in-out infinite alternate;
    }

    .glow-1 {
      background: #ff3d9a;
      top: -150px;
      left: -150px;
    }

    .glow-2 {
      background: #8a4dff;
      bottom: -180px;
      right: -150px;
      animation-delay: 2s;
    }

    @keyframes glowMove {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(40px, 30px) scale(1.15);
      }
    }

    .main-container {
      width: 100%;
      max-width: 720px;
      position: relative;
      z-index: 5;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.075);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 30px;
      padding: 25px;
    }

    .title {
      text-align: center;
      font-size: clamp(27px, 7vw, 45px);
      font-weight: 800;
      margin: 0;
      background: linear-gradient(90deg, #fff, #ff9bd4, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(255, 100, 190, 0.2);
    }

    .subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 8px;
      font-size: 14px;
    }

    .progress-area {
      margin-top: 25px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 9px;
    }

    .progress-track {
      width: 100%;
      height: 9px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 5%;
      border-radius: 100px;
      background: linear-gradient(90deg, #ff4da6, #c56cff);
      box-shadow: 0 0 20px rgba(255, 70, 170, 0.5);
      transition: width 0.5s ease;
    }

    .question-card {
      margin-top: 28px;
      padding: 28px 22px;
      border-radius: 25px;
      background: rgba(0, 0, 0, 0.17);
      border: 1px solid rgba(255, 255, 255, 0.08);
      animation: cardIn 0.5s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .question-number {
      text-align: center;
      color: #ff9bd4;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .question {
      text-align: center;
      font-size: clamp(20px, 5vw, 28px);
      line-height: 1.7;
      font-weight: 700;
      margin: 0 auto 25px;
      max-width: 620px;
    }

    .answer-input {
      width: 100%;
      min-height: 145px;
      resize: vertical;
      border: 1px solid rgba(255, 255, 255, 0.13);
      outline: none;
      border-radius: 20px;
      padding: 17px;
      font-family: "Cairo", sans-serif;
      font-size: 16px;
      line-height: 1.8;
      color: white;
      background: rgba(255, 255, 255, 0.07);
      transition: 0.25s ease;
    }

    .answer-input::placeholder {
      color: rgba(255, 255, 255, 0.42);
    }

    .answer-input:focus {
      border-color: rgba(255, 100, 190, 0.6);
      box-shadow: 0 0 0 4px rgba(255, 80, 170, 0.08);
      background: rgba(255, 255, 255, 0.09);
    }

    .submit-answer-btn,
    .next-btn,
    .action-btn {
      width: 100%;
      border: 0;
      cursor: pointer;
      color: white;
      font-family: "Cairo", sans-serif;
      font-size: 16px;
      font-weight: 800;
      border-radius: 18px;
      padding: 15px 18px;
      margin-top: 14px;
      transition: 0.22s ease;
      background: linear-gradient(135deg, #ff3f9e, #9c4dff);
      box-shadow: 0 10px 30px rgba(214, 70, 170, 0.22);
    }

    .submit-answer-btn:hover,
    .next-btn:hover,
    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(214, 70, 170, 0.3);
    }

    .submit-answer-btn:active,
    .next-btn:active,
    .action-btn:active {
      transform: scale(0.98);
    }

    .submit-answer-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .answer-review {
      display: none;
      margin-top: 25px;
      animation: cardIn 0.5s ease;
    }

    .review-title {
      text-align: center;
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .review-box {
      padding: 17px;
      border-radius: 18px;
      margin-bottom: 13px;
      line-height: 1.9;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user-answer-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ahmed-answer-box {

        rgba(255, 65, 160, 0.11),
        rgba(140, 75, 255, 0.11)

      border: 1px solid rgba(255, 100, 190, 0.16);
    }

    .review-label {
      display: block;
      color: #ff9bd4;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .next-btn {
      margin-top: 8px;
    }

    .final-screen {
      display: none;
      text-align: center;
      animation: finalIn 0.8s ease;
    }

    @keyframes finalIn {
      from {
        opacity: 0;
        transform: scale(0.94);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .final-heart {
      font-size: 65px;
      animation: heartbeat 1.3s ease-in-out infinite;
      display: inline-block;
      margin-bottom: 5px;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }

    .final-title {
      font-size: clamp(25px, 7vw, 38px);
      font-weight: 800;
      margin-bottom: 22px;
    }

    .final-message {
      min-height: 170px;
      padding: 22px;
      border-radius: 23px;
      background: rgba(0, 0, 0, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.09);
      font-size: clamp(16px, 4.5vw, 21px);
      line-height: 2.1;
      color: rgba(255, 255, 255, 0.95);
      text-align: center;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background: #ff8ccc;
      vertical-align: middle;
      margin-right: 3px;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .final-buttons {
      margin-top: 18px;
      display: grid;
      gap: 11px;
    }

    .action-btn.secondary {
      background: rgba(255, 255, 255, 0.075);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: none;
    }

    .action-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.11);
    }

    .floating-heart,
    .sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
    }

    .floating-heart {
      animation: floatUp linear forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.7) rotate(0deg);
      }

      15% {
        opacity: 0.8;
      }

      100% {
        opacity: 0;
        transform: translateY(-110vh) scale(1.2) rotate(35deg);
      }
    }

    .sparkle {
      animation: sparkleAnim 1.7s ease-in-out forwards;
    }

    @keyframes sparkleAnim {
      0% {
        opacity: 0;
        transform: scale(0) rotate(0deg);
      }

      30% {
        opacity: 1;
        transform: scale(1) rotate(90deg);
      }

      100% {
        opacity: 0;
        transform: scale(0.2) rotate(180deg);
      }
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 500px) {
      .page {
        padding: 14px 10px 25px;
      }

      .glass-card {
        padding: 18px 13px;
        border-radius: 24px;
      }

      .question-card {
        padding: 23px 15px;
      }

      .answer-input {
        min-height: 130px;
      }
    }
  </style>
</head>

<body>

  <div class="background-glow glow-1"></div>
  <div class="background-glow glow-2"></div>

  <div class="page">

    <main class="main-container">

      <div class="glass-card">

        <section id="final-screen" class="final-screen">

            </button>

            <button
              class="action-btn secondary"
              onclick="copyAnswers()"
            >
              📋 نسخ كل الأسئلة وإجاباتها ❤️
            </button>

            <!-- إعادة اللعب -->
            <button
              class="action-btn secondary"
              onclick="restartGame()"
            >
              🔄 العب من جديد
            </button>

          </div>

        </section>

      </div>

    </main>
  </div>

    /* ==============================

    ============================== */

    let audioContext = null;

    function playTone(
      frequency = 520,
      duration = 0.08
    ) {

      try {

        if (!audioContext) {
          audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();
        }

        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = frequency;

        gain.gain.setValueAtTime(
          0.001,
          audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          0.08,
          audioContext.currentTime + 0.01
        );

        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime + duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
          audioContext.currentTime + duration
        );

      } catch (error) {
        // تجاهل الخطأ إذا المتصفح يمنع الصوت
      }
    }

    /* ==============================
       تحميل السؤال

    function loadQuestion() {

      const data =
        quizData[currentQuestion];

      progressPercent.textContent =
        percent + "%";

      progressBar.style.width =
        percent + "%";

      answerInput.value = "";

      answerInput.disabled = false;

      submitButton.disabled = false;

      replyArea.style.display = "none";

      answerInput.focus();

      document
        .querySelector(".question-card")
        .style.animation = "none";

      void document
        .querySelector(".question-card")
        .offsetWidth;

      document
        .querySelector(".question-card")
        .style.animation = "cardIn 0.5s ease";
    }


    /* ==============================
       إرسال الإجابة
    ============================== */

    function submitAnswer() {

      const answer =
        answerInput.value.trim();

      if (!answer) {

        answerInput.focus();

        answerInput.animate(
          [
            { transform: "translateX(0)" },
            { transform: "translateX(-5px)" },
            { transform: "translateX(5px)" },
            { transform: "translateX(0)" }
          ],
          {
            duration: 250
          }
        );

        return;
      }

      playTone(620, 0.1);

      createSparkles();

      confetti({
        particleCount: 35,
        spread: 65,
        origin: {
          y: 0.65
        }
      });

      userAnswers[currentQuestion] =
        answer;

      userAnswerText.textContent =
        answer;

      ahmedReplyText.textContent =
        quizData[currentQuestion].ahmedReply;

      answerInput.disabled = true;

      submitButton.disabled = true;

      replyArea.style.display = "block";

      setTimeout(() => {

        replyArea.scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });

      }, 100);

    }


    /* ==============================
       السؤال التالي
    ============================== */

    function nextQuestion() {

      playTone(720, 0.08);

      currentQuestion++;

      if (
        currentQuestion >=
        quizData.length
      ) {

        showFinalScreen();

        return;
      }

      loadQuestion();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    /* ==============================
       الشاشة النهائية
    ============================== */

    function showFinalScreen() {

      quizSection.style.display = "none";

      quizHeader.style.display = "none";

      finalScreen.style.display = "block";

      finalMessage.innerHTML = "";

      createSparkles();

      confetti({
        particleCount: 180,
        spread: 120,
        startVelocity: 35,
        origin: {
          y: 0.55
        }
      });

      typeFinalMessage();
    }


    /* ==============================
       كتابة الرسالة حرف حرف
    ============================== */

    let typingTimer = null;

    function typeFinalMessage() {

      if (typingTimer) {
        clearInterval(typingTimer);
        typingTimer = null;
      }

      finalMessage.innerHTML =
        '<span class="cursor"></span>';

      let index = 0;

      typingTimer = setInterval(() => {

        if (index >= finalMessageText.length) {

          clearInterval(typingTimer);

          typingTimer = null;

          finalMessage.innerHTML =
            finalMessageText;

          return;
        }

        const currentText =
          finalMessageText.slice(
            0,
            index + 1
          );

        finalMessage.innerHTML =
          currentText +
          '<span class="cursor"></span>';

        index++;

      }, 32);
    }


    /* ==============================
       إعادة قراءة الرسالة
    ============================== */

    function readFinalMessageAgain() {

      playTone(580, 0.1);

      createSparkles();

      finalMessage.animate(
        [
          {
            opacity: 0.35,
            transform: "scale(0.98)"
          },
          {
            opacity: 1,
            transform: "scale(1)"
          }
        ],
        {
          duration: 400
        }
      );

      typeFinalMessage();
    }


    /* ==============================
       نسخ جميع الأسئلة والإجابات
    ============================== */

    async function copyAnswers() {

      let fullText =
        "💌 تحدي القلوب مع أحمد\n\n";

      fullText +=
        "=============================\n\n";

      quizData.forEach((item, index) => {

        fullText +=
          "السؤال " +
          (index + 1) +
          ":\n";

        fullText +=
          item.q +
          "\n\n";

        fullText +=
          "إجابتها:\n";

        fullText +=
          (userAnswers[index] ||
          "لم تتم الإجابة") +
          "\n\n";

        fullText +=
          "جواب أحمد:\n";

        fullText +=
          item.ahmedReply +
          "\n\n";

        fullText +=
          "-----------------------------\n\n";
      });

      fullText +=
        "💌 الرسالة الأخيرة:\n\n";

      fullText +=
        finalMessageText;


      try {

        await navigator.clipboard.writeText(
          fullText
        );

        playTone(850, 0.12);

        confetti({
          particleCount: 50,
          spread: 70,
          origin: {
            y: 0.7
          }
        });

        alert(
          "تم نسخ كل الأسئلة وإجاباتها ❤️"
        );

      } catch (error) {

        const textArea =
          document.createElement("textarea");

        textArea.value = fullText;

        textArea.style.position =
          "fixed";

        textArea.style.opacity = "0";

        document.body.appendChild(
          textArea
        );

        textArea.focus();

        textArea.select();

        try {

          document.execCommand(
            "copy"
          );

          alert(
            "تم نسخ كل الأسئلة وإجاباتها ❤️"
          );

        } catch (err) {

          alert(
            "ماقدرتش ننسخ النص تلقائياً، جربي مرة ثانية."
          );

        }

        document.body.removeChild(
          textArea
        );
      }
    }


    /* ==============================
       إعادة اللعبة من البداية
    ============================== */

    function restartGame() {

      playTone(500, 0.1);

      currentQuestion = 0;

      userAnswers = [];

      finalScreen.style.display =
        "none";

      quizHeader.style.display =
        "block";

      quizSection.style.display =
        "block";

      loadQuestion();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    /* ==============================
       Enter لإرسال الإجابة
       Shift + Enter = سطر جديد
    ============================== */

    answerInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          submitAnswer();

        }

      }
    );


    /* ==============================
       البداية
    ============================== */

    loadQuestion();

  </script>

</body>
</html>
